     spent on something cheaper earlier. Try each such family against every
     commitment worth less than it. */
  let improved = true, guard = 0;
  while(improved && guard++ < 3){
    improved = false;
    for(const s of sockets){
      for(const c of legal.get(s) || []){
        if((claimed[c.family] || 0) >= c.rank) continue;
        const gain = marginal({...c, type:s.ex.src});
        const cur = placed.find(p => p.s === s);
        /* A reserved resonance is never displaced. The repair pass compares
           raw marginal value, which is exactly the comparison the bard pass
           was written to overrule — letting it run here would undo the
           reservation on the next line. */
        if(cur?.pinned) continue;
        if(!cur || gain <= cur.v) continue;
        claimed[cur.c.family] = 0;              // give the displaced family back
        s.entry.exalts[s.ex.k] = c.i.id;
        claimed[c.family] = c.rank;
        cur.c = c; cur.v = gain;
        log.push(`${s.slot} ${s.ex.n}: swapped to ${c.nm} (from ${c.i.name})`);
        improved = true;
        for(const o of sockets) if(o.slot === s.slot && o !== s) refresh(o);
        break;
      }
    }
  }

  state.exaltSkipped = sockets.length - placed.length;
  return log;
}

/** @param fillOnly leave slots that already hold something alone */
function autoBiS(fillOnly){
  const xp = TIER_XP[state.planTier] || 0;
  const taken = new Set();
  const picked = [];
  /* Running family coverage. Every pick is priced marginally against it, so
     the tenth slot won't buy a focus the third slot already brought. Locked
     and (in fill mode) kept slots seed it, since their effects are real. */
  const cov = {};
  for(const [k,e] of Object.entries(state.equipped)){
    const it = byId[e.itemId];
    if(it && (state.locked.has(k) || fillOnly)) addCoverage(cov, it);
  }

  // locked slots (and, in fill mode, everything already equipped) claim their LORE first
  for(const [k,e] of Object.entries(state.equipped)){
    const keep = state.locked.has(k) || fillOnly;
    const it = byId[e.itemId];
    if(keep && it && (it.tags.includes("LORE") || it.tags.includes("LORE_EQUIPPED")))
      taken.add(it.name);
  }
  if(!fillOnly) for(const k of Object.keys(state.equipped))
    if(!state.locked.has(k)) delete state.equipped[k];

  /* hands first, as a pair — see pickHands */
  const handsFree = !state.locked.has("PRIMARY") && !state.locked.has("SECONDARY") &&
                    !(fillOnly && (state.equipped.PRIMARY || state.equipped.SECONDARY));
  if(handsFree){
    const hands = pickHands(taken, cov);
    state.handChoice = hands ? {mode:hands.mode, total:hands.total, rival:hands.rival} : null;
    if(hands){
      const put = (k, c) => {
        if(!c) return;
        state.equipped[k] = {itemId:c.i.id, xp,
          exalts:{ornament:null,focus:null,click:null,worn:null,proc:null}};
        if(c.i.tags.includes("LORE") || c.i.tags.includes("LORE_EQUIPPED")) taken.add(c.i.name);
        picked.push(`${k} ${c.i.name} (${c.s.toFixed(0)})`);
      };
      put("PRIMARY", hands.primary);
      put("SECONDARY", hands.offhand);
      if(hands.primary) addCoverage(cov, hands.primary.i);
      if(hands.offhand) addCoverage(cov, hands.offhand.i);
    }
  }

  for(const k of AUTO_ORDER){
    if(state.locked.has(k)) continue;
    if(fillOnly && state.equipped[k]) continue;
    if(handsFree && (k === "PRIMARY" || k === "SECONDARY")) continue;
    const best = bisCandidates(k, taken, {covered:cov})[0];
    if(!best) continue;
    addCoverage(cov, best.i);
    state.equipped[k] = {itemId:best.i.id, xp,
      exalts:{ornament:null,focus:null,click:null,worn:null,proc:null}};
    if(best.i.tags.includes("LORE") || best.i.tags.includes("LORE_EQUIPPED"))
      taken.add(best.i.name);
    picked.push(`${k} ${best.i.name} (${best.s.toFixed(0)})`);
  }
  state.lastAuto = picked;
  /* Effects last: sockets can only be judged against the item that ended up
     in the slot, so this has to run after every slot is settled. */
  state.lastExalt = autoExaltAll();
  render();
}

/* Re-fit PRIMARY and SECONDARY only, leaving the other twenty slots exactly
   where they are. Locked hands are honoured — locking is how you tell the
   planner "I've decided this one", and a mode switch shouldn't overrule that.
   Coverage and LORE are seeded from everything you're still wearing, so the
   new mainhand won't buy a focus your chest already carries or a LORE name
   your finger already claimed. */
function repickHands(){
  if(state.locked.has("PRIMARY") || state.locked.has("SECONDARY")) return;
  const xp = TIER_XP[state.planTier] || 0;
  const cov = {}, taken = new Set();
  for(const [k,e] of Object.entries(state.equipped)){
    if(k === "PRIMARY" || k === "SECONDARY") continue;
    const it = byId[e.itemId]; if(!it) continue;
    addCoverage(cov, it);
    if(it.tags.includes("LORE") || it.tags.includes("LORE_EQUIPPED")) taken.add(it.name);
  }
  delete state.equipped.PRIMARY;
  delete state.equipped.SECONDARY;
  const hands = pickHands(taken, cov);
  state.handChoice = hands ? {mode:hands.mode, total:hands.total, rival:hands.rival} : null;
  if(!hands) return;
  const put = (k, c) => {
    if(!c) return;
    state.equipped[k] = {itemId:c.i.id, xp,
      exalts:{ornament:null,focus:null,click:null,worn:null,proc:null}};
  };
  put("PRIMARY", hands.primary);
  put("SECONDARY", hands.offhand);
}

/* The wiki writes resists out in full; nobody compares them that way. Short
   codes keep five of them on one line without wrapping. */
const RESIST_KEYS = [["SV MAGIC","MR"],["SV FIRE","FR"],["SV COLD","CR"],
                     ["SV DISEASE","DR"],["SV POISON","PR"]];
const MISC_KEYS = [["HASTE","Haste","%"],["BACKSTAB","BS",""],["ENDUR","End",""]];

/* Every stat an item carries, at the tier you're planning for.
 *
 * Scaled rather than raw on purpose: the score beside it is computed at
 * state.planTier, so printing base stats next to a tier-7 score would invite
 * exactly the comparison the numbers don't support. scaledItem is the same
 * function scoreParts uses, so the two can't drift.
 *
 * Zero-value stats are omitted rather than printed as dashes — an item with
 * four stats should look like four stats, not like sixteen mostly empty
 * columns. Grouping (attributes together, resists together) is what preserves
 * scanability once the padding is gone.
 */
function fullStats(i){
  const sc = scaledItem(i, TIER_XP[state.planTier] || 0);
  const s = sc.stats || {};
  /* Whatever the list is sorted on gets highlighted, so you can see at a
     glance which column produced the ordering. Cell keys are real stat keys
     ("SV MAGIC", "HASTE"), so the non-stat sorts simply never match. */
  const hi = state.sort;
  const cell = (label, v, key, suffix = "") => {
    const cls = "st" + (key && key === hi ? " hi" : "") + (v < 0 ? " neg" : "");
    return `<span class="${cls}">${label}<b>${v > 0 ? "+" : ""}${v}${suffix}</b></span>`;
  };
  const out = [];

  if(sc.dmg) out.push(`<span class="st${state.sort==="ratio"?" hi":""}">${
    sc.dmg}/${sc.delay}<b> ${(sc.dmg/sc.delay).toFixed(2)}</b></span>`);
  /* AC reads as a magnitude, not a modifier, so no + sign on it. */
  if(s.AC) out.push(`<span class="st${hi==="AC"?" hi":""}">AC<b> ${s.AC}</b></span>`);
  if(s.HP) out.push(cell("HP ", s.HP, "HP"));
  if(s.MANA) out.push(cell("Mana ", s.MANA, "MANA"));

  const attrs = ATTRS.filter(k => s[k]).map(k => cell(k + " ", s[k], k));
  if(attrs.length) out.push(`<span class="grp">${attrs.join("")}</span>`);

  const res = RESIST_KEYS.filter(([k]) => s[k]).map(([k, lbl]) => cell(lbl + " ", s[k], k));
  if(res.length) out.push(`<span class="grp">${res.join("")}</span>`);

  for(const [k, lbl, sfx] of MISC_KEYS)
    if(s[k]) out.push(cell(lbl + " ", s[k], k, sfx));

  if(sc.wt != null && sc.wt > 0)
    out.push(`<span class="st${hi==="wt"?" hi":""}">Wt<b> ${sc.wt}</b></span>`);

  if(!out.length) return `<span class="none">no stats</span>`;
  return out.join("");
}

const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/** Lead with whatever the list is sorted on, so the ordering is legible.
 *  The stat summary that used to trail each of these now has its own line
 *  below the name, in full — repeating a subset here just competed with it. */
function sortStat(i){
  const s = i.stats || {};
  if(state.sort === "fit") return "";
  if(state.sort === "bis"){
    const v = slotScore(i, state.view.slot);
    const cut = state.view.slot === "SECONDARY" && isWeapon(i) && offhandFactor() < 1;
    return `<b class="score">${v.toFixed(0)}</b>${cut?`<span class="hint"> offhand</span>`:""}`;
  }
  if(state.sort === "weighted"){
    const v = sortKey(i, active());
    return `<b style="color:var(--brass)">${v.toFixed(0)}</b>`;
  }
  if(state.sort === "ratio")
    return i.dmg && i.delay ? `<b style="color:var(--brass)">${(i.dmg/i.delay).toFixed(2)}</b>` : "";
  if(state.sort === "wt") return `<b style="color:var(--brass)">${i.wt ?? "—"}</b>`;
  if(state.sort === "sumattr")
    return `<b style="color:var(--brass)">${ATTRS.reduce((a,k)=>a+(s[k]||0),0)}</b>`;
  const v = s[state.sort];
  /* Short code here as well, so the badge matches the label used in the row
     below it — "SV FIRE" beside "FR +10" reads as two different stats. */
  const lbl = (RESIST_KEYS.find(([k]) => k === state.sort)
            || [null, {MANA:"Mana", HASTE:"Haste"}[state.sort] || state.sort])[1];
  return `<b style="color:${v?"var(--brass)":"var(--faint)"}">${lbl} ${v?(v>0?"+":"")+v:"—"}</b>`;
}

function tagPills(i){
  let h = "";
  if(i.tags.includes("LORE") || i.tags.includes("LORE_EQUIPPED")) h += `<span class="pill lore">Lore</span>`;
  if(i.tags.includes("MAGIC")) h += `<span class="pill magic">Magic</span>`;
  if(i.tags.includes("QUEST")) h += `<span class="pill quest">Quest</span>`;
  if(i.tags.includes("NO_DROP") || i.tags.includes("NO_TRADE")) h += `<span class="pill no">No drop</span>`;
  if(i.non_legends){
    /* Its own pill rather than an era name. Showing "Kunark" on an item that
       isn't on the server would read as a date you could plan toward. */
    h += `<span class="pill ooe" title="The wiki page carries the NON-LEGENDS CONTENT banner — inherited live-EQ content that doesn't exist on this server">Not in Legends</span>`;
  } else if(outOfEra(i)){
    const {ix, src} = eraOf(i);
    const inferred = src === "zone-inferred" || src === "scraper-inferred";
    h += `<span class="pill ooe" title="${inferred
      ? "No era category on the wiki — inferred from drop zone" : "Wiki era category"}">${
      eraName(ix) ? esc(eraName(ix).replace(/ Era$/, "")) : "Out of era"}${inferred ? "?" : ""}</span>`;
  } else {
    const rev = revisedLater(i);
    if(rev) h += `<span class="pill ooe" title="Wiki also tags this ${rev} — the stats shown may be the later revision">Revised ${esc(rev.replace(/ Era$/, ""))}</span>`;
    if(supersededVersion(i)) h += `<span class="pill ooe">Superseded version</span>`;
  }
  if(i.charges) h += `<span class="pill chg">${i.charges} charges</span>`;
  if((i.source||[]).includes("craft")) h += `<span class="pill craft">Crafted</span>`;
  if((i.source||[]).includes("vendor")) h += `<span class="pill vend">Vendor</span>`;
  return h;
}

/* ---------------- render: BiS weights ---------------- */
function renderWeights(){
  syncWeights();
  const el = document.getElementById("wpanel");
  const w = activeWeights(), custom = state.wMode === "custom";
  const act = active();

  document.getElementById("wsub").textContent =
    custom ? "custom vector" : `derived from ${act.join(" / ") || "no classes"}`;

  const field = (k, hint) => `<div class="wf ${w[k]?"hot":""}">
    <label for="w_${k}">${k}</label>
    <input type="number" id="w_${k}" data-w="${k}" step="0.1" value="${w[k] ?? 0}">
    ${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;

  let h = `<div class="wmode">
    <button class="mbtn ${custom?"":"on"}" data-wmode="auto">From my classes</button>
    <button class="mbtn ${custom?"on":""}" data-wmode="custom">Custom</button>
    <span class="spacer"></span>
    <button class="mbtn" id="wreset" title="Copy the class-derived vector into the fields">Reset to class defaults</button>
  </div>`;

  h += `<div class="wgrid">${W_STATS.map(k => field(k)).join("")}
    ${W_SPECIAL.map(([k,hint]) => field(k, hint)).join("")}</div>`;

  h += `<div class="planbar"><span class="lbl">Score at tier</span>
    <input type="range" id="ptier" min="0" max="10" value="${state.planTier}">
    <span class="pv">+${state.planTier}</span>
    <span class="lbl" style="letter-spacing:.04em;text-transform:none">
      ranks items as if levelled this far</span></div>`;

  const hm = state.handMode || "auto";
  h += `<div class="wmode handbar"><span class="lbl">Hands</span>
    ${HAND_MODES.map(([k,l,t]) =>
      `<button class="mbtn ${hm===k?"on":""}" data-hand="${k}" title="${t}">${l}</button>`).join("")}
    </div>
    <div class="handnote">${hm === "auto"
      ? `Both hands are scored as a pair — a two-hander has to beat the best one-hander <i>plus</i> whatever the offhand would have held. Pick a shape above to overrule that.`
      : `<b>Override:</b> ${esc(HAND_MODES.find(m=>m[0]===hm)[2])}. The scorer now finds the best gear <i>within</i> that shape instead of choosing the shape for you.${
          hm === "dual" && offhandFactor() === 0
            ? ` <span style="color:var(--bad)">Nothing in this trio can dual wield, so the offhand weapon's damage counts for zero — you're buying its stats and effects only.</span>` : ""}`}</div>`;

  /* Bard-only, and gated on the class rather than the flag: with no bard in
     the trio the toggle isn't drawn at all, because a control that is present
     but inert invites exactly the "I turned it on and nothing happened"
     confusion. The flag is still remembered underneath. */
  if(active().includes("BRD")){
    const bi = bardInstrOn();
    const held = ["PRIMARY","SECONDARY","ANY1","ANY2"].filter(k => {
      const it = state.equipped[k] && byId[state.equipped[k].itemId];
      return it && canHoldResonance(it);
    }).length;
    h += `<div class="wmode handbar"><span class="lbl">Bard</span>
      <button class="mbtn ${bi?"on":""}" data-bardinstr="1"
        title="Reserve held-item focus sockets for instrument resonances">Maximise resonances</button>
      </div>
      <div class="handnote">${bi
        ? `<b>On.</b> Resonances claim the focus socket of every held item before any other family is allowed to bid, and the no-stack rule keeps each pass on a new family — so you end up with as many <i>different</i> resonances as you have held items, not four copies of the best one. The Any slots also prefer an item that can take one. Four families exist in the data (String, Brass, Wind, Percussion), so four is the ceiling.
           <b>${held}</b> of your four held slots currently hold${held===1?"s":""} something that qualifies.`
        : `Resonance is exaltable onto anything held, so the bard's play is the best weapon with a drum's focus grafted in — not the drum. Turn this on to reserve those sockets before a caster's focus takes them.`}
        <span style="color:var(--faint)">Run "Fill exaltations" after equipping to apply it.</span></div>`;
  }

  const filters = [];
  if(state.zones.size) filters.push(`<b>${state.zones.size} zone${state.zones.size===1?"":"s"}</b>`);
  if(state.src.size)   filters.push(`<b>${[...state.src].join(", ")}</b>`);
  if(state.inEra)      filters.push(`available at <b>${esc(state.era)}</b>`);
  if(state.locked.size)filters.push(`<b>${state.locked.size} locked slot${state.locked.size===1?"":"s"}</b> untouched`);

  h += `<div class="wact">
    <button class="btn btn-brass" id="autobis">Auto-equip BiS</button>
    <button class="btn" id="fillbis">Fill empty slots only</button>
    <button class="btn" id="fillex" title="Socket the best legal focus/click/worn/proc into everything you're wearing">Fill exaltations</button>
    <button class="btn" id="clearall">Clear loadout</button>
    <button class="btn" id="forget" title="Wipe the saved setup from this browser and start clean on the next refresh">Forget saved setup</button>
    <div class="scope">Picks run through the same filters as the browser${
      filters.length ? " — currently " + filters.join(" · ") : ", and nothing is filtered right now"
    }. Class, race and LORE are enforced; a two-hander in Primary skips Secondary;
    summoned gear only appears if someone here can summon it.
    ${state.lastAuto?.length ? `<br><span style="color:var(--dim)">Last run filled ${state.lastAuto.length} slot${state.lastAuto.length===1?"":"s"}${
      state.lastExalt?.length ? ` and socketed ${state.lastExalt.length} exaltation${state.lastExalt.length===1?"":"s"}` : ""}.</span>` : ""}
    ${state.lastExalt && !state.lastExalt.length && state.planTier < 1
      ? `<br><span style="color:var(--faint)">No exaltations socketed — the first socket unlocks at +1, so raise "Score at tier".</span>` : ""}
    ${state.exaltSkipped ? `<br><span style="color:var(--faint)">${state.exaltSkipped} socket${state.exaltSkipped===1?"":"s"} left empty — every legal source there duplicates a family you already cover, and exaltations don't stack.</span>` : ""}
    <br><span style="color:var(--faint)">${
      state.saveOff ? `Saved setup wiped — nothing further is stored this session.`
      : DATA.seed ? `Not saving — running on the built-in seed, so equipped items couldn't be restored anyway.`
      : `Setup saves to this browser automatically.${
          state.restored ? ` Restored ${state.restored.n} slot${state.restored.n===1?"":"s"} on load.` : ""
        }${
          state.restored?.dropped.length
            ? ` <span style="color:var(--bad)">${state.restored.dropped.length} saved entr${state.restored.dropped.length===1?"y":"ies"} no longer exist${state.restored.dropped.length===1?"s":""} in this item database and ${state.restored.dropped.length===1?"was":"were"} dropped.</span>`
            : ""
        }`}</span></div>
  </div>`;

  el.innerHTML = h;

  el.querySelectorAll("[data-wmode]").forEach(b => b.onclick = () => {
    state.wMode = b.dataset.wmode; render();
  });
  /* Changing the shape re-fits the hands on the spot rather than waiting for a
     full Auto-equip. A selector that visibly does nothing until you press
     another button reads as broken, and re-running the whole loadout would
     throw away the other twenty slots to answer a two-slot question. */
  el.querySelectorAll("[data-hand]").forEach(b => b.onclick = () => {
    if(state.handMode === b.dataset.hand) return;
    state.handMode = b.dataset.hand;
    repickHands();
    render();
  });
  /* No repickHands() here any more: the toggle no longer changes what goes in
     your hands, only what gets socketed into it and what the flex slots
     prefer. Re-fitting the hands on click would move gear for no reason. */
  el.querySelectorAll("[data-bardinstr]").forEach(b => b.onclick = () => {
    state.bardInstr = !state.bardInstr;
    render();
  });
  document.getElementById("wreset").onclick = () => {
    state.weights = derivedWeights(); state.wMode = "custom"; render();
  };
  el.querySelectorAll("[data-w]").forEach(inp => {
    inp.onchange = () => {
      syncWeights();
      state.weights = {...activeWeights(), [inp.dataset.w]:(+inp.value || 0)};
      state.wMode = "custom";
      render();
      const n = document.getElementById("w_" + inp.dataset.w);
      if(n){ n.focus(); n.select(); }
    };
  });
  const pt = document.getElementById("ptier");
  pt.oninput = () => {
    state.planTier = +pt.value;
    el.querySelector(".pv").textContent = "+" + state.planTier;
  };
  pt.onchange = () => render();

  document.getElementById("autobis").onclick = () => autoBiS(false);
  document.getElementById("fillbis").onclick = () => autoBiS(true);
  document.getElementById("fillex").onclick = () => { state.lastExalt = autoExaltAll(); render(); };
  document.getElementById("clearall").onclick = () => {
    for(const k of Object.keys(state.equipped)) if(!state.locked.has(k)) delete state.equipped[k];
    state.lastAuto = null; render();
  };
  /* Deliberately does not touch the live state — this wipes the SAVE, so what
     you're looking at survives until you refresh. Clearing both at once makes
     it impossible to tell which of the two things the button did. */
  document.getElementById("forget").onclick = () => {
    if(!confirm("Forget the saved setup?\n\nThis browser will start clean on the next refresh, and nothing more is saved this session. What's on screen right now is untouched.")) return;
    forgetState();
    clearTimeout(saveTimer);
    state.saveOff = true;
    render();
  };
}

/* ---------------- render: paper doll ---------------- */
function renderDoll(){
  const act = active(), errs = {};
  issues().filter(i => i.t === "err").forEach(i => {
    const m = i.m.match(/in (EAR1|EAR2|HEAD|FACE|NECK|SHOULDERS|ARMS|BACK|WRIST1|WRIST2|RANGE|HANDS|PRIMARY|SECONDARY|FINGER1|FINGER2|CHEST|LEGS|FEET|WAIST|AMMO|ANY1|ANY2)/);
    if(m) errs[m[1]] = 1;
  });
  Object.entries(state.equipped).forEach(([k,e]) => {
    const it = byId[e.itemId];
    if(it && (it.tags.includes("LORE") || it.tags.includes("LORE_EQUIPPED"))){
      const dupes = Object.entries(state.equipped).filter(([,x]) => byId[x.itemId]?.name === it.name);
      if(dupes.length > 1) errs[k] = 1;
    }
  });

  document.getElementById("doll").innerHTML = SLOTS.map(s => {
    const e = state.equipped[s.k], it = e && byId[e.itemId];
    const sel = state.view.slot === s.k;
    const cls = ["slot", it ? "filled" : "", sel ? "sel" : "",
                 s.a === "*" ? "any" : "", errs[s.k] ? "bad" : "",
                 state.locked.has(s.k) ? "locked" : ""].join(" ");
    let inner = `<div class="slot-name">${s.n}</div>`;
    if(it){
      inner += `<div class="slot-item">${esc(it.name)}</div><div class="slot-meta">
        <span class="lvl">+${tierOf(e.xp||0)}</span>
        <span class="gems">${EXALTS.map(x =>
          `<span class="gem ${e.exalts[x.k] || (x.k==='ornament'&&e.exalts.ornament) ? "on" : ""} ${x.k==='ornament'?'orn':''}"></span>`).join("")}</span>
        ${errs[s.k] ? `<span class="flag err">!</span>` : ""}
        ${(it.tags.includes("LORE")||it.tags.includes("LORE_EQUIPPED")) ? `<span class="flag lore">Lore</span>` : ""}
        ${state.locked.has(s.k) ? `<span class="flag lk">lock</span>` : ""}
      </div>`;
    } else {
      inner += `<div class="slot-empty">${s.a === "*" ? "flex — anything" : "empty"}</div>`;
    }
    return `<button class="${cls}" data-slot="${s.k}">${inner}</button>`;
  }).join("");

  document.querySelectorAll("[data-slot]").forEach(b =>
    b.onclick = () => { state.view = {mode:"slot", slot:b.dataset.slot, exalt:null}; render(); });
}

/* ---------------- render: totals ---------------- */
const ATTRS = ["STR","STA","AGI","DEX","WIS","INT","CHA"];

/** gear contribution, at each item's current tier */
function gearStats(){
  const t = {AC:0,HP:0,MANA:0,STR:0,STA:0,AGI:0,DEX:0,WIS:0,INT:0,CHA:0};
  /* HASTE is deliberately NOT in the additive table above. Only the single
     best worn source applies, so it is a max, not a sum — a loadout with a
     36% cloak and a 20% belt is at 36%, and showing +56 would be a lie you
     could gear into. */
  let haste = 0, hasteFrom = null;
  Object.values(state.equipped).forEach(e => {
    const it = byId[e.itemId]; if(!it) return;
    const s = scaledItem(it, e.xp||0).stats;
    for(const k in t) if(s[k]) t[k] += s[k];
    const ih = it.haste_type === "pet" ? 0 : (s.HASTE || 0);
    if(ih > haste){ haste = ih; hasteFrom = it.name; }
  });
  t.HASTE = haste;
  gearStats.hasteFrom = hasteFrom;
  return t;
}

function renderTotals(){
  const t = gearStats();
  document.getElementById("totals").innerHTML = Object.entries(t).map(([k,v]) => {
    const tip = k === "HASTE" && gearStats.hasteFrom
      ? ` title="best worn source: ${esc(gearStats.hasteFrom)} — haste does not stack"` : "";
    const lbl = k === "HASTE" ? "HASTE" : k;
    const suf = k === "HASTE" && v ? "%" : "";
    return `<div class="tot"${tip}><dt>${lbl}</dt><dd class="${v?"":"z"}">${v>0?"+":""}${v}${suf}</dd></div>`;
  }).join("");
}

/* ---------------- render: where the set comes from ----------------
   The counterpart to the zone filter: once gear is on, this is the farm route.
   An item that drops in three zones counts in all three — the question being
   answered is "where could I get this", not "where will I get it". */
function renderZoneSum(){
  const el = document.getElementById("zonesum");
  const eq = Object.values(state.equipped).map(e => byId[e.itemId]).filter(Boolean);
  /* .data-note carries padding, a border-top and a background, so clearing
     innerHTML alone still leaves a visible empty strip under the Loadout card
     on first load. Hide the element itself. */
  if(!eq.length){ el.innerHTML = ""; el.hidden = true; return; }
  el.hidden = false;
  const c = {};
  eq.forEach(i => zonesOf(i).forEach(z => c[z] = (c[z]||0)+1));
  const rows = Object.entries(c).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
  const only = rows.filter(([,n]) => n === 1).length;
  el.innerHTML = `<b>Set draws on ${rows.length} zone${rows.length===1?"":"s"}</b>` +
    (only ? ` · ${only} contributing a single piece` : "") + `<br>` +
    rows.map(([z,n]) => `${esc(z)} <span style="color:var(--brass)">${n}</span>`).join(" · ") +
    (state.zones.size ? `<br><span style="color:var(--faint)">Browser is filtered to ${state.zones.size} zone${state.zones.size===1?"":"s"}.</span>` : "");
}

/* ---------------- render: zone filter ----------------
   This lives outside the drawer on purpose. state.zones is a GLOBAL filter —
   it applies to every slot, and it persists as you click through them — so
   burying its only control inside the drawer's empty-slot branch meant an
   active filter could sit there invisibly, silently shrinking every list,
   with no way to see or clear it until you happened to click an empty slot.

   Counts are global for the same reason: they answer "how much of my usable
   gear comes out of this zone", not "how much of it fits the slot I happen to
   be looking at". Era, source and class/race still apply, since those really
   do change what's on the table. */
/* globalZoneCounts and exaltPool both filter the FULL item set, and both are
   called on every render — the zone panel redraws whenever anything changes.
   Neither depends on the slot, so the result is the same until one of the
   global filters moves. Key the memo on exactly those inputs; anything not in
   the key (equipped gear, open panels, sort order) can't change the answer. */
const poolKey = () => [state.era, state.inEra, [...state.src].sort().join(","),
  state.mobLvlMin, state.mobLvl, [...state.zones].sort().join(","),
  state.classes.join(","), state.race, DATA.items.length].join("|");
const memoPool = (name, build) => {
  const k = poolKey();
  if(_poolMemo.k !== k) _poolMemo = {k};      // any change invalidates all
  return _poolMemo[name] ||= build();
};

function globalZoneCounts(){
  return memoPool("zoneCounts", _globalZoneCounts);
}
function _globalZoneCounts(){
  const act = active(), c = {};
  let pool = DATA.items;
  if(state.inEra)    pool = pool.filter(i => !outOfEra(i) && !supersededVersion(i));
  if(state.src.size) pool = pool.filter(i => (i.source||[]).some(s => state.src.has(s)));
  if(state.mobLvl)   pool = pool.filter(passesMobLevel);
  pool = pool.filter(i => usableBy(i.classes, act) && raceOk(i, state.race));
  pool.forEach(i => zonesOf(i).forEach(z => c[z] = (c[z]||0) + 1));
  return c;
}

function renderZones(){
  const el = document.getElementById("zonefilter");
  if(!el) return;
  const counts = globalZoneCounts();
  const zAll = Object.entries(counts).sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));

  document.getElementById("zonesub").textContent = state.zones.size
    ? `${state.zones.size} selected` : "all zones";

  let h = "";

  /* Mob-level window. Renders only when moblevels.json actually loaded — a
     slider over data that doesn't exist would filter nothing and look broken.
     Sits with Zones because both answer "where am I farming", and both are
     global: every slot you open obeys them. */
  /* Rendered even with no data loaded. Hiding it silently was worse: there was
     no way to tell "this build has no such feature" from "moblevels.json 404'd",
     which is exactly the confusion it caused. */
  if(!_mobLevelCount && !Object.keys(QUESTLEVELS).length){
    h += `<div class="fbar"><button class="fbtn" id="mlbtn" style="flex:1 1 100%">
      <span style="color:var(--faint)">Mob level · no data</span>
      <span class="cnt">${state.mobOpen?"▴":"▾"}</span></button></div>`;
    if(state.mobOpen)
      h += `<div class="zpanel"><div class="zmore">
        <b>moblevels.json didn't load.</b> The planner fetches it, and the
        optional questlevels.json, from the same folder as index.html,
        alongside items.json. Check that
        <code>./moblevels.json</code> is reachable — on GitHub Pages it must be
        committed at the repo root, and the filename is case-sensitive.
        Generate it by running <code>scrape_eqlwiki.py</code>.</div></div>`;
  } else {
    const on = !!state.mobLvl;
    h += `<div class="fbar" style="flex-wrap:wrap;gap:6px">
      <button class="fbtn ${on?"on":""}" id="mlbtn" style="flex:1 1 100%">
        <span>${on ? `Mob level · ${state.mobLvlMin}–${state.mobLvl}` : "Mob level · any"}</span>
        <span class="cnt">${state.mobOpen?"▴":"▾"}</span></button>
      ${on?`<button class="clr" id="mlclr">clear</button>`:""}</div>`;
    if(state.mobOpen){
      /* A closed window (max 0) still has to show SOMETHING sensible on the
         bar, so an off filter draws as the full span rather than as two thumbs
         piled at zero with no fill between them. */
      const hi = state.mobLvl || MOBLVL_MAX;
      h += `<div class="zpanel" style="padding:10px 12px">
        <div class="dualrow">
          <span class="cap" id="mlminv">${state.mobLvlMin}</span>
          <div class="dual" style="flex:1">
            <div class="track"></div>
            <div class="fill" id="mlfill"></div>
            <input type="range" id="mlmin" min="0" max="${MOBLVL_MAX}" step="1"
              value="${state.mobLvlMin}" aria-label="Minimum mob level">
            <input type="range" id="mlmax" min="0" max="${MOBLVL_MAX}" step="1"
              value="${hi}" aria-label="Maximum mob level">
          </div>
          <span class="cap" id="mlmaxv">${state.mobLvl || "any"}</span></div>
        <div class="zmore" style="margin-top:2px">Drag the left dot for the
          floor, the right for the ceiling. Push the right one to ${MOBLVL_MAX}
          and the min to 0 to turn the filter off. Hides dropped gear whose
          easiest source mob falls outside the window — vendor, craft and forage
          items are never hidden, and neither is anything whose mob has no level
          on the wiki.</div></div>`;
    }
  }

  h += `<div class="fbar">
    <button class="fbtn ${state.zones.size?"on":""}" id="zbtn">
      <span>${state.zones.size ? `Zones · ${state.zones.size} selected` : "Zones · all"}</span>
      <span class="cnt">${state.zoneOpen?"▴":"▾"} ${zAll.length}</span></button>
    ${state.zones.size?`<button class="clr" id="zclr">clear</button>`:""}</div>`;

  if(state.zoneOpen){
    const q = state.zoneQ.toLowerCase();
    let list = zAll.filter(([z]) => !q || z.toLowerCase().includes(q));
    const CAPZ = 60, over = Math.max(0, list.length - CAPZ);
    list = list.slice(0, CAPZ);
    /* A selected zone must stay visible even when nothing usable comes out of
       it, or you can't untick it without clearing the whole filter. */
    for(const z of state.zones)
      if(!list.some(([n]) => n === z)) list.push([z, counts[z] || 0]);
    h += `<div class="zpanel">
      <input type="search" id="zq" placeholder="Find a zone…" value="${esc(state.zoneQ)}">
      <div class="zlist">${list.map(([z,n]) => {
        /* Level hint per zone: with a window set, this is what tells you which
           zones can still feed it without opening each one. A zone whose mobs
           all sit outside the window is dimmed — not hidden, because you may
           want it anyway for a vendor or quest item. */
        const r = _mobLevelCount ? zoneLevelRange(z) : null;
        const outside = state.mobLvl && r &&
          (r[1] < state.mobLvlMin || r[0] > state.mobLvl);
        return `<button class="zchip ${state.zones.has(z)?"on":""} ${(n && !outside)?"":"dim"}" data-zone="${esc(z)}"
          ${r?`title="Mobs here that drop gear: level ${r[0]}–${r[1]}"`:""}>
          ${esc(z)}${r?` <span class="n" style="opacity:.7">${r[0]}–${r[1]}</span>`:""} <span class="n">${n}</span></button>`;
      }).join("")}
        ${over?`<div class="zmore">+${over} more — type above to narrow.</div>`:""}
        ${zAll.length?"":`<div class="zmore">No zone data in the loaded set.</div>`}</div></div>`;
  }

  if(state.zones.size)
    h += `<div class="note">Every slot you open stays inside these zones — build
      the whole set out of one farm route, then clear it.</div>`;

  el.innerHTML = h;

  const mb = el.querySelector("#mlbtn");
  if(mb) mb.onclick = () => { state.mobOpen = !state.mobOpen; renderZones(); };
  const mc = el.querySelector("#mlclr");
  if(mc) mc.onclick = () => { state.mobLvlMin = 0; state.mobLvl = 0; render(); };
  const mn = el.querySelector("#mlmin"), mx = el.querySelector("#mlmax");
  if(mn && mx){
    const fill = el.querySelector("#mlfill");
    const lo = el.querySelector("#mlminv"), hi = el.querySelector("#mlmaxv");

    const paint = () => {
      const a = +mn.value, b = +mx.value;
      fill.style.left  = (a / MOBLVL_MAX * 100) + "%";
      fill.style.width = ((b - a) / MOBLVL_MAX * 100) + "%";
      lo.textContent = a;
      /* Say "any" whenever the window is actually inert — the full span, and
         also both thumbs parked at 0, which commits to the same off state.
         Showing "0" there would read as "mobs up to level 0", i.e. nothing. */
      hi.textContent = (b >= MOBLVL_MAX || b === 0) && a === 0 ? "any" : b;
      /* Thumb stacking. Both inputs cover the full track, so when the thumbs
         are close the one painted on top would swallow every grab. Raise
         whichever thumb the pointer is nearer to — without this, the min
         handle becomes impossible to pick up once it meets the max. */
      const mid = MOBLVL_MAX / 2;
      mn.style.zIndex = (a > mid) ? 4 : 3;
      mx.style.zIndex = (a > mid) ? 3 : 4;
    };

    /* Clamp on INPUT, not change: a thumb must not be draggable past its
       partner even mid-gesture, or the bar visibly crosses itself. */
    mn.oninput = () => {
      if(+mn.value > +mx.value) mn.value = mx.value;
      paint();
    };
    mx.oninput = () => {
      if(+mx.value < +mn.value) mx.value = mn.value;
      paint();
    };

    /* Commit on release only — re-rendering the whole planner per input event
       fights the gesture, especially on a phone. */
    const commit = () => {
      state.mobLvlMin = +mn.value;
      /* Full span = filter off, stored as 0 so the rest of the app has one
         "no ceiling" representation instead of two. */
      state.mobLvl = (+mx.value >= MOBLVL_MAX && +mn.value === 0) ? 0 : +mx.value;
      render();
    };
    mn.onchange = commit;
    mx.onchange = commit;
    paint();
  }

  const zb = el.querySelector("#zbtn");
  if(zb) zb.onclick = () => { state.zoneOpen = !state.zoneOpen; renderZones(); };
  const zc = el.querySelector("#zclr");
  if(zc) zc.onclick = () => { state.zones.clear(); render(); };
  el.querySelectorAll("[data-zone]").forEach(b => b.onclick = () => {
    const z = b.dataset.zone;
    state.zones.has(z) ? state.zones.delete(z) : state.zones.add(z);
    render();                        // the drawer and totals track the filter too
  });
  const zq = el.querySelector("#zq");
  if(zq) zq.oninput = () => { state.zoneQ = zq.value; renderZones();
    const n = el.querySelector("#zq");
    n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}

/* ---------------- render: character sheet ----------------
   base(race) + adds(class1..3) + gear. EQL has no point buy, so race and the
   three classes fully determine the naked sheet — which is the whole reason a
   triple-INT trio starts absurd. */
function renderChar(){
  const el = document.getElementById("charsheet");
  const act = active();
  const base = CHAR.races[state.race];
  const sub = document.getElementById("charsub");

  if(!base){
    sub.innerHTML = "";
    el.innerHTML = `<div class="empty"><b>Pick a race</b>Set a race above to see base attributes and what each class adds.</div>`;
    return;
  }

  const adds = {}, per = {};
  ATTRS.forEach(a => adds[a] = 0);
  act.forEach(c => {
    per[c] = CHAR.classes[c] || {};
    ATTRS.forEach(a => adds[a] += (per[c][a] || 0));
  });

  const gear = gearStats();
  const cap = CHAR.attr_cap || 150;

  /* Verified invariant: every class adds exactly 30. If an edit breaks it, say so. */
  const bad = act.filter(c => Object.values(CHAR.classes[c]||{}).reduce((a,b)=>a+b,0) !== (CHAR.class_add_total||30));
  sub.innerHTML = CHAR.verified
    ? `<span class="badge ok">verified</span>`
    : `<span class="badge" title="These are classic-EQ numbers carried over on an assumption. See chardata.json.">unverified</span>`;

  const castStats = new Set(act.map(c => CHAR.casting_stat?.[c]).filter(Boolean));

  let h = `<table class="sheet"><thead><tr><th></th><th>Base</th>
    ${act.map(c => `<th>${c}</th>`).join("")}<th>Naked</th><th>Gear</th><th>Total</th></tr></thead><tbody>`;
  for(const a of ATTRS){
    const naked = base[a] + adds[a], total = naked + (gear[a]||0);
    h += `<tr class="${castStats.has(a)?"key":""}"><td>${a}</td><td class="g">${base[a]}</td>
      ${act.map(c => `<td class="g">${per[c][a] ? "+"+per[c][a] : "·"}</td>`).join("")}
      <td>${naked}</td>
      <td class="gear">${gear[a] ? (gear[a]>0?"+":"")+gear[a] : "·"}</td>
      <td class="tot ${total > cap ? "over" : ""}">${total}${total > cap ? "‡" : ""}</td></tr>`;
  }
  h += `</tbody></table>`;

  h += `<div class="data-note">`;
  if(castStats.size){
    const pools = act.filter(c => CHAR.casting_stat?.[c])
      .map(c => `${c} (${CHAR.casting_stat[c]})`);
    h += `<b>Mana:</b> ${pools.length ? pools.join(", ") + " cast" : "no casters"}. Pools come from your
      <b>two highest</b> classes only — a third caster adds nothing. Each class works its pool off its own
      casting stat, highlighted above. The formula is unpublished, so there's no number here.<br>`;
  }
  if(act.length < 3) h += `<b>${3-act.length} class slot${act.length===2?"":"s"} empty</b> — each class is worth exactly 30 points.<br>`;
  if([...ATTRS].some(a => base[a]+adds[a]+(gear[a]||0) > cap))
    h += `‡ over the reported ${cap} ceiling. Players report it; it isn't in the client, so nothing is clamped.<br>`;
  if(bad.length) h += `<span style="color:var(--bad)"><b>chardata is off:</b> ${bad.join(", ")} don't add to ${CHAR.class_add_total||30}.</span><br>`;
  if(!CHAR.verified) h += `Attribute numbers are <b>classic EQ values, unverified for EQL</b> — the wiki doesn't publish them. Check them against your own stat window and fix <code>chardata.json</code>.`;
  h += `</div>`;
  el.innerHTML = h;
}

/* ---------------- render: rules log ---------------- */
function renderLog(){
  const is = issues();
  document.getElementById("log").innerHTML = is.map(i =>
    `<div class="issue ${i.t}"><span class="ico">${i.ico}</span><span>${i.m}</span></div>`).join("");
  const e = is.filter(i => i.t === "err").length, w = is.filter(i => i.t === "warn").length;
  document.getElementById("logsub").textContent =
    e || w ? `${e} blocking · ${w} to watch` : "all clear";
}

/* ---------------- render: drawer ---------------- */
function renderDrawer(){
  const d = document.getElementById("drawer");
  const {slot, exalt} = state.view;

  if(!slot){
    document.getElementById("dtitle").textContent = "Browser";
    document.getElementById("dsub").textContent = "";
    d.innerHTML = `<div class="empty"><b>Pick a slot</b>Click any slot on the left to see the gear that fits it, filtered to your classes and race.</div>`;
    return;
  }
  const sdef = SLOTS.find(s => s.k === slot);
  const entry = state.equipped[slot];

  /* --- exaltation source picker --- */
  if(exalt && entry){
    const ex = EXALTS.find(x => x.k === exalt);
    const eff = effective(entry);
    document.getElementById("dtitle").textContent = ex.n + " exaltation";
    document.getElementById("dsub").textContent = eff.base.name;

    let h = `<button class="back" id="back">&larr; back to ${esc(eff.base.name)}</button>`;
    if(ex.k === "ornament"){
      h += `<div class="note"><b>Cosmetic only.</b> ${ex.note}<br><br>The wiki currently notes: <i>"Ornamentation Tokens are not currently available."</i></div>`;
      d.innerHTML = h; document.getElementById("back").onclick = back; return;
    }

    const cands = DATA.items.filter(i => i.effects?.[ex.src]);
    const scored = cands.map(i => {
      const c = cx(eff.classes, i.classes), s = sx(eff.slots, i.slots);
      const slotOk = sdef.a === "*" ? true : (s && s.includes(sdef.a));
      const ok = !isSummoned(i) && c.length > 0 && s && s.length > 0 && slotOk && usableBy(c, active());
      let why = "";
      if(isSummoned(i)) why = `Summoned — you can't level a second copy, so there's no exaltation to extract.`;
      else if(!c.length) why = `No shared class with ${eff.base.name}.`;
      else if(!s || !s.length) why = `Slot restriction (${i.slots.join("/")}) can't meet ${eff.slots.join("/")}.`;
      else if(!slotOk) why = `Would force ${eff.base.name} to ${s.join("/")} — not ${sdef.n}.`;
      else if(!usableBy(c, active())) why = `Result usable only by ${c.join("/")}.`;
      return {i, ok, why, c, s};
    }).sort((a,b) => (b.ok - a.ok) || a.i.name.localeCompare(b.i.name));

    h += `<div class="note"><b>Unlocks at +${ex.req}.</b> Level a second copy of the source item to +${ex.req}, then its ${ex.n.toLowerCase()} becomes a removable exaltation. Sockets here only if it shares a class and a legal slot.</div>`;

    if(!scored.length){
      h += `<div class="empty"><b>No ${ex.n.toLowerCase()} sources</b>The loaded data has no items with a ${ex.n.toLowerCase()} effect. Load the full scrape to populate this.</div>`;
    } else {
      h += scored.map(({i, ok, why, c, s}) => {
        const eff2 = i.effects[ex.src];
        return `<button class="row ${ok?"":"ineligible"}" data-src="${i.id}" ${ok?"":"disabled"}>
          <div class="row-top"><span class="row-name">${esc(eff2.name)}</span>
            <span class="row-stat">+${ex.req}</span></div>
          <div class="row-sub">from <b style="color:var(--dim)">${esc(i.name)}</b> · ${showList(i.classes)} · ${i.slots.join("/")}
            ${eff2.level ? " · L"+eff2.level : ""}</div>
          <div class="row-drop">${dropLine(i) || "No drop data on wiki"}</div>
          ${ok ? (c.join("/") !== eff.classes.join("/") || s.join("/") !== eff.slots.join("/")
              ? `<div class="row-sub" style="color:var(--warn)">⚠ narrows target to ${c.join("/")} · ${s.join("/")}</div>` : "")
            : `<div class="row-sub" style="color:var(--bad)">✕ ${why}</div>`}
        </button>`;
      }).join("");
    }
    d.innerHTML = h;
    document.getElementById("back").onclick = back;
    d.querySelectorAll("[data-src]").forEach(b => b.onclick = () => {
      state.equipped[slot].exalts[exalt] = b.dataset.src;
      state.view.exalt = null; render();
    });
    return;
  }

  /* --- equipped item detail + exaltation rail --- */
  if(entry){
    const eff = effective(entry), it = eff.base;
    document.getElementById("dtitle").textContent = sdef.n;
    document.getElementById("dsub").textContent = `+${eff.sc.tier} · ${(eff.sc.cum*100).toFixed(1)}%`;

    let tip = "";
    if(it.tags.length) tip += `<span class="t-tag">${it.tags.map(t=>t.replace("_"," ")+" ITEM").join(" ")}</span>\n`;
    tip += `<span class="t-key">Slot:</span> ${eff.slots.join(" ")}\n`;
    if(it.skill) tip += `<span class="t-key">Skill:</span> ${it.skill}  <span class="t-key">Atk Delay:</span> ${it.delay}\n`;
    if(it.dmg) tip += `<span class="t-key">DMG:</span> ${eff.sc.dmg}${eff.sc.dmg!==it.dmg?`<span class="delta"> (+${eff.sc.dmg-it.dmg})</span>`:""}` +
      (it.delay ? `  <span class="t-key">Ratio:</span> ${(eff.sc.dmg/it.delay).toFixed(2)}` : "") + `\n`;
    const st = Object.entries(eff.sc.stats||{}).map(([k,v]) => {
      const b = it.stats[k], d = v - b;
      return `${k}: ${v>0?"+":""}${v}${d ? `<span class="delta${d<0?" neg":""}"> (${d>0?"+":""}${d})</span>` : ""}`;
    }).join("  ");
    if(st) tip += st + "\n";
    if(it.charges) tip += `<span class="t-key">Charges:</span> ${it.charges}\n`;
    if(it.wt != null) tip += `<span class="t-key">WT:</span> ${eff.sc.wt}  <span class="t-key">Size:</span> ${it.size||"—"}\n`;
    tip += `<span class="t-key">Class:</span> ${eff.classes.join(" ")}\n`;
    tip += `<span class="t-key">Race:</span> ${showList(it.races)}\n`;
    if(it.effects?.focus) tip += `<span class="t-foc">Focus Effect: ${esc(it.effects.focus.name)}</span>\n`;
    ["proc","click","worn"].forEach(t => { if(it.effects?.[t])
      tip += `<span class="t-eff">Effect: ${esc(it.effects[t].name)} (${esc(it.effects[t].detail||t)})</span>\n`; });

    let h = `<div class="tip"><div class="tip-name">${esc(it.name)}</div><pre>${tip.trim()}</pre></div>`;

    const tier = eff.sc.tier;
    h += `<div class="rail"><div class="rail-h"><h3>Tier</h3>
      <div class="tierpick">${TIER_XP.map((x,l) =>
        `<button data-lvl="${l}" class="${tier===l?"on":""} ${l>4?"gated":""}" title="${TIER_XP[l]} xp">+${l}</button>`).join("")}</div></div>`;

    h += `<div class="xpbar"><input type="range" id="xp" min="0" max="${MAX_XP}" value="${entry.xp||0}">
      <span class="xpv">${entry.xp||0} / ${MAX_XP} xp</span></div>`;

    if(tier < 10){
      const need = TIER_XP[tier+1] - (entry.xp||0);
      const mote = [...MOTES].reverse().find(m => tier <= m.max);
      h += `<div class="note"><b>+${tier} → +${tier+1}: ${need} more xp.</b>
        Merging a duplicate at +${tier} gives ${TIER_XP[tier]||1} xp${tier>=1?` — a copy at +${tier+1} gives ${TIER_XP[tier+1]}`:""}.
        ${mote ? `Best mote that still feeds this: <b>Mote of ${mote.n} Potential</b> (${mote.xp} xp, caps at +${mote.max}) — ${Math.ceil(need/mote.xp)} of them.` : `No mote can feed an item this high; only duplicates work.`}
        Stats creep up as xp lands, not just on ding.</div>`;
    }

    h += `<div class="rail"><div class="rail-h"><h3>Exaltations</h3><div class="sub">sockets open by tier</div></div>`;

    h += EXALTS.map(x => {
      const locked = eff.sc.tier < x.req;
      const srcId = entry.exalts[x.k], src = srcId && byId[srcId];
      const val = x.k === "ornament"
        ? (src ? src.name + " (appearance)" : null)
        : (src ? `${src.effects[x.src].name} — from ${src.name}` : null);
      return `<div class="exalt ${locked?"locked":""} ${src?"set":"open"} ${x.k==='ornament'?'orn-s':''}"
                data-ex="${locked?"":x.k}">
        <span class="socket">${locked ? "🔒" : (src ? "" : "+"+x.req)}</span>
        <span class="ex-txt"><span class="ex-type">${x.n}</span>
          <span class="ex-val ${val?"":"none"}">${val ? esc(val) : (locked ? `locked — needs +${x.req}` : "empty · click to fit")}</span></span>
        ${src ? `<button class="ex-clear" data-clr="${x.k}">clear</button>` : `<span class="ex-req">+${x.req}</span>`}
      </div>`;
    }).join("") + `</div>`;

    if(tier < 4)
      h += `<div class="note"><b>+${tier} of +4 for sockets.</b> The last exaltation socket opens at +4, but stats keep climbing to +10 — at +10 every stat is double its tier-0 value.</div>`;

    eff.applied.forEach(a => {
      if(a.narrowedClass || a.narrowedSlot)
        h += `<div class="note warn"><b>${esc(a.src.name)}</b>'s ${a.type.n.toLowerCase()} carried its own restrictions onto ${esc(it.name)}: now <b>${eff.classes.join("/")}</b> · <b>${eff.slots.join("/")}</b>. This is not cosmetic — it changes where the item can be worn.</div>`;
    });

    if(it.crafted_by?.length)
      h += `<div class="note"><b>Player crafted.</b> ${it.crafted_by.slice(0,3).map(esc).join("<br>")}</div>`;
    /* how this piece rates against what else could sit here, under your weights */
    const rivals = bisCandidates(slot, new Set(), {ignoreTwoHand:true})
      .filter(c => c.i.id !== it.id).slice(0, 3);
    const mine = slotScore(it, slot);
    h += `<div class="note"><b>${slot === "SECONDARY" ? "Offhand value" : "BiS score"}
      ${mine.toFixed(0)}</b> at +${state.planTier}, under your
      ${state.wMode === "custom" ? "custom" : "class-derived"} weights.
      ${slot === "SECONDARY" && isWeapon(it)
        ? `Damage counted at ${(offhandFactor()*100).toFixed(0)}%${offhandFactor()?"":" — nothing in this trio dual wields"}; stats and effects in full. `
        : ""}
      ${rivals.length ? "Next best here: " + rivals.map(r =>
        `${esc(r.i.name)} <span class="score">${r.s.toFixed(0)}</span>`).join(" · ") +
        "." : "Nothing else passes the current filters for this slot."}</div>`;

    /* the pair comparison, shown from either hand */
    /* Shown on all four resonance-capable slots, not just the hands — the flex
       slots are the whole point of the toggle and the place where the choice
       is actually live. */
    /* Per-item provenance. A derived number shouldn't be silent — if a Sky
       reward is being rated 46 because of its quest zone rather than a mob it
       drops from, that reasoning should be visible on the item. */
    if(state.mobLvl){
      const lv = itemMobLevel(it);
      if(lv !== null){
        /* Ask whether a DROP produced the number, not whether a drops array
           exists — the empty-mobs case above has entries but may still be
           rated by its quest. */
        const dropLv = dropMobLevel(it);
        const q = dropLv !== null ? null : questContentLevel(it);
        const why = q && QUESTWHY[String(q.quest).toLowerCase()];
        h += `<div class="note">Rated <b>level ${lv}</b>${q
          ? ` by <b>${esc(q.quest)}</b>${why ? ` — hardest requirement is ${esc(why)}` : ""}`
          : ` by its easiest drop mob`}.</div>`;
      }
    }

    if(bardInstrOn() && ["PRIMARY","SECONDARY","ANY1","ANY2"].includes(slot)){
      const ok = canHoldResonance(it);
      h += `<div class="note ${ok ? "" : "warn"}">
        <b>Bard: maximising resonances.</b>
        ${ok
          ? `${esc(it.name)} can take a resonance, so its focus socket is reserved for one before any other family is allowed to bid.`
          : `${esc(it.name)} can't take a resonance — instruments are Primary/Secondary only — so wearing it here spends one of your four possible families.`}
        Turn "Maximise resonances" off in the BiS panel to score these sockets on value alone.</div>`;
    }

    if(slot === "PRIMARY" || slot === "SECONDARY"){
      const hands = pickHands();
      /* Under an override there is no rival to compare against — the losing
         branch was filtered out before it could be scored. So re-run the pair
         in auto and show what you gave up, which is the number that actually
         tells you whether the override was worth it. */
      if(state.handMode !== "auto"){
        const auto = pickHands(new Set(), {}, "auto");
        const mine = hands ? hands.total : 0;
        const shape = HAND_MODES.find(m => m[0] === state.handMode)[1];
        h += `<div class="note ${auto && auto.total > mine + 0.5 ? "warn" : ""}">
          <b>Hands forced to ${esc(shape)}.</b>
          ${hands ? `Best pair in that shape: ${esc(hands.primary.i.name)}${
              hands.offhand ? ` + ${esc(hands.offhand.i.name)}` : " with an empty offhand"
            } — <span class="score">${mine.toFixed(0)}</span>.`
            : `Nothing in the current filters fits that shape.`}
          ${auto ? ` Left to itself the scorer would take ${esc(auto.primary.i.name)}${
              auto.offhand ? ` + ${esc(auto.offhand.i.name)}` : ""
            } for <span class="score">${auto.total.toFixed(0)}</span>${
              auto.total > mine + 0.5 ? `, so this override costs you ${(auto.total - mine).toFixed(0)}.`
              : `, which is no better.`}` : ""}
          Set Hands back to Auto in the BiS panel to release it.</div>`;
      }
      else if(hands && hands.rival != null){
        /* "dual wield" only if the trio can actually dual wield AND the offhand
           is a weapon — a paladin holding a shield, or a wizard holding a second
           wand, is a one-hand-plus-offhand build, not a dual wield one. */
        const win = hands.mode === "two-hand" ? "Two-hander"
          : (offhandFactor() > 0 && hands.offhand && isWeapon(hands.offhand.i))
            ? "Dual wield" : "One-hand + offhand";
        h += `<div class="note ${hands.mode === "dual" ? "" : "warn"}">
          <b>${win} wins these two slots: ${hands.total.toFixed(0)} vs ${hands.rival.toFixed(0)}.</b>
          ${hands.mode === "dual"
            ? `${esc(hands.primary.i.name)}${hands.offhand?` + ${esc(hands.offhand.i.name)}`:" with an empty offhand"} —
               a two-hander has to beat both hands together, not just the mainhand.`
            : `${esc(hands.primary.i.name)} out-scores the best pair, so the offhand stays empty.`}
          Auto-equip resolves both hands together; lock a slot to overrule it.</div>`;
      }
    }

    h += `<div class="lockrow"><button id="lockslot" class="${state.locked.has(slot)?"on":""}">
      ${state.locked.has(slot) ? "Locked — auto-equip skips this slot" : "Lock this slot against auto-equip"}
    </button></div>`;

    h += `<button class="row" id="unequip" style="color:var(--bad)"><div class="row-top"><span class="row-name">Remove ${esc(it.name)}</span></div></button>`;
    h += `<div class="data-note">Source: <a href="${it.url}" target="_blank" rel="noopener">${it.url.replace("https://","")}</a></div>`;

    d.innerHTML = h;
    const setXp = v => {
      entry.xp = Math.max(0, Math.min(MAX_XP, v));
      const t = tierOf(entry.xp);
      EXALTS.forEach(x => { if(t < x.req) entry.exalts[x.k] = null; });
      render();
    };
    d.querySelectorAll("[data-lvl]").forEach(b => b.onclick = () => setXp(TIER_XP[+b.dataset.lvl]));
    const xpEl = document.getElementById("xp");
    if(xpEl) xpEl.oninput = () => {
      entry.xp = +xpEl.value;
      const t = tierOf(entry.xp);
      EXALTS.forEach(x => { if(t < x.req) entry.exalts[x.k] = null; });
      renderDoll(); renderTotals(); renderChar(); renderLog();
      d.querySelector(".xpv").textContent = `${entry.xp} / ${MAX_XP} xp`;
      document.getElementById("dsub").textContent = `+${t} · ${(cumBonus(entry.xp)*100).toFixed(1)}%`;
    };
    if(xpEl) xpEl.onchange = () => render();
    d.querySelectorAll("[data-ex]").forEach(el => { if(el.dataset.ex) el.onclick = ev => {
      if(ev.target.dataset.clr) return;
      state.view.exalt = el.dataset.ex; render();
    };});
    d.querySelectorAll("[data-clr]").forEach(b => b.onclick = ev => {
      ev.stopPropagation(); entry.exalts[b.dataset.clr] = null; render();
    });
    document.getElementById("lockslot").onclick = () => {
      state.locked.has(slot) ? state.locked.delete(slot) : state.locked.add(slot);
      render();
    };
    document.getElementById("unequip").onclick = () => {
      delete state.equipped[slot]; state.locked.delete(slot); render(); };
    return;
  }

  /* --- gear list for an empty slot --- */
  document.getElementById("dtitle").textContent = sdef.n + (sdef.a === "*" ? " (flex)" : "");
  const act = active();
  let pool = slotPool(slot);
  const hiddenEra = state.inEra ? pool.filter(i => outOfEra(i) || supersededVersion(i)).length : 0;
  if(state.inEra) pool = pool.filter(i => !outOfEra(i) && !supersededVersion(i));
  if(state.q) pool = pool.filter(i =>
    (i.name + " " + (i.drops||[]).map(x=>x.zone+" "+x.mobs.join(" ")).join(" ")).toLowerCase()
      .includes(state.q.toLowerCase()));

  /* Facet counts are computed with every filter EXCEPT the facet's own applied,
     so a count tells you what you'd get by clicking, not what you already have. */
  const bySrc  = i => !state.src.size   || (i.source||[]).some(s => state.src.has(s));
  const byLvl  = passesMobLevel;
  const byZone = i => !state.zones.size || zonesOf(i).some(z => state.zones.has(z));

  const srcCounts = {};
  pool.filter(byZone).forEach(i => (i.source||[]).forEach(s => srcCounts[s] = (srcCounts[s]||0)+1));

  const preFilter = pool.length;
  pool = pool.filter(bySrc).filter(byZone).filter(byLvl);

  const scored = pool.map(i => {
    let ok = true, why = "";
    if(!usableBy(i.classes, act)){ ok = false; why = `Needs ${showList(i.classes)}`; }
    else if(!raceOk(i, state.race)){ ok = false; why = `${showList(i.races)} only`; }
    /* Greyed out rather than hidden: "there is no magician here" is a fact
       about your group, not about the item, and it changes the moment you
       swap a class. Better to see it struck through than to wonder where it
       went. The hand-shape override gets the same treatment. */
    else if(!canSummon(i, act)){ ok = false; why = summonWhy(i); }
    else if(handFilter(slot, state.handMode) && !handFilter(slot, state.handMode)(i)){
      ok = false;
      why = state.handMode === "twohand" && slot === "SECONDARY"
        ? `Offhand is empty — you've set the hands to Two-hander.`
        : `Doesn't fit the ${HAND_MODES.find(m => m[0] === state.handMode)[1]} setting.`;
    }
    else {
      const dupe = Object.entries(state.equipped).find(([k,e]) =>
        byId[e.itemId]?.name === i.name &&
        (i.tags.includes("LORE") || i.tags.includes("LORE_EQUIPPED")));
      if(dupe){ ok = false; why = `LORE — already equipped in ${dupe[0]}`; }
    }
    return {i, ok, why, k:sortKey(i, act)};
  }).sort((a,b) => (b.ok - a.ok) || (b.k - a.k) || a.i.name.localeCompare(b.i.name));

  const nFilt = (state.zones.size ? 1 : 0) + (state.src.size ? 1 : 0);
  document.getElementById("dsub").textContent =
    `${scored.filter(s=>s.ok).length} usable / ${pool.length}` +
    (nFilt ? ` of ${preFilter}` : "");

  const SRC = [["drop","Drops"],["quest","Quest"],["vendor","Vendor"],["craft","Crafted"],["forage","Forage"]];
  let h = `<div class="search"><input type="search" id="q" placeholder="Filter by name, zone or mob…" value="${esc(state.q)}"></div>`;

  /* The zone facet used to live here. It's a global filter, so it now has its
     own always-visible card — see renderZones(). */

  h += `<div class="sortbar"><label for="sort">Sort</label><select id="sort">${SORTS.map(([k,l]) =>
      `<option value="${k}" ${state.sort===k?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="chips">${SRC.map(([k,l]) =>
      `<button class="chip ${state.src.has(k)?"on":""}" data-srcf="${k}" title="${srcCounts[k]||0} here">${l}${srcCounts[k]?` · ${srcCounts[k]}`:""}</button>`).join("")}
      <button class="chip era ${state.inEra?"on":""}" id="erachip" title="Hide gear that isn't obtainable at ${esc(state.era)}, plus superseded versions of items">
        ${state.inEra ? `${esc(state.era.replace(/ Era$/,""))} only${hiddenEra?` · ${hiddenEra} hidden`:""}` : "Showing all eras"}</button></div>`;

  /* The mob-level window lives in the Zones card now — like the zone filter
     it's global, so a per-slot copy would let two slots disagree. Mirror it
     here as a read-only note so the drawer explains its own item count. */
  if(state.mobLvl)
    h += `<div class="note"><b>Mob level ${state.mobLvlMin}–${state.mobLvl}.</b>
      Gear outside that window is hidden — by its easiest drop mob, or for a
      quest reward with no drops, by the hardest kill or turn-in its quest
      actually requires. Vendor, craft and forage items and anything with no level at all
      still show. Change the window in the Zones panel.</div>`;

  if(state.zones.size)
    h += `<div class="note"><b>Zone filter active:</b> ${[...state.zones].map(esc).join(" · ")}.
      Change it in the Zones panel.</div>`;
  if(sdef.a === "*")
    h += `<div class="note"><b>Any slot.</b> Takes any equippable item at full stats — a second shield for AC, a spare breastplate, a boot dagger for backstab. Class and race rules still apply.</div>`;

  if(!scored.length){
    h += `<div class="empty"><b>Nothing here</b>${DATA.seed
      ? "The built-in seed only holds a handful of verified items. Run <code>scrape_eqlwiki.py</code> and load the result to browse the full database."
      : "No items match this slot and filter."}</div>`;
  } else {
    const CAP = 150, shown = scored.slice(0, CAP);
    if(scored.length > CAP)
      h += `<div class="note"><b>Showing ${CAP} of ${scored.length}.</b> Type above to narrow by name, zone or mob — or use the filters.</div>`;
    h += shown.map(({i, ok, why}) => `<button class="row ${ok?"":"ineligible"}" data-eq="${i.id}" ${ok?"":"disabled"}>
      <div class="row-top"><span class="row-name">${esc(i.name)}</span><span class="row-stat">${sortStat(i)}</span></div>
      <div class="row-stats">${fullStats(i)}</div>
      <div class="row-sub">${tagPills(i)} ${showList(i.classes)} ${i.races.includes("ALL")?"":"· "+showList(i.races)}
        ${i.effects?.focus?`<span class="pill foc">Focus</span>`:""}
        ${i.effects?.proc?`<span class="pill foc">Proc</span>`:""}
        ${i.effects?.click?`<span class="pill foc">Click</span>`:""}
        ${i.effects?.worn?`<span class="pill foc">Worn</span>`:""}</div>
      <div class="row-drop">${dropLine(i) || "No drop data on wiki"}</div>
      ${ok?"":`<div class="row-sub" style="color:var(--bad)">✕ ${why}</div>`}
    </button>`).join("");
  }
  d.innerHTML = h;
  const ec = document.getElementById("erachip");
  if(ec) ec.onclick = () => { state.inEra = !state.inEra; renderDrawer(); };
  const so = document.getElementById("sort");
  if(so) so.onchange = () => { state.sort = so.value; renderDrawer(); };

  d.querySelectorAll("[data-srcf]").forEach(b => b.onclick = () => {
    const k = b.dataset.srcf;
    state.src.has(k) ? state.src.delete(k) : state.src.add(k);
    renderDrawer();
  });
  const q = document.getElementById("q");
  q.oninput = () => { state.q = q.value; renderDrawer();
    const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  d.querySelectorAll("[data-eq]").forEach(b => b.onclick = () => {
    state.equipped[slot] = {itemId:b.dataset.eq, xp:0,
      exalts:{ornament:null,focus:null,click:null,worn:null,proc:null}};
    state.q = ""; render();
  });
}
const back = () => { state.view.exalt = null; render(); };

/* ---------------- data note ---------------- */
function renderDataNote(){
  document.getElementById("datanote").innerHTML = DATA.seed
    ? `<b>Running on the built-in seed — ${DATA.items.length} items.</b> These four are hand-verified against eqlwiki so the rules engine has something real to chew on (they reproduce the wiki's own Earthshaker → Short Sword of the Ykesha example exactly).<br><br>
       For the real thing, run <code>scrape_eqlwiki.py</code> — it pulls every equippable item from eqlwiki (stats, tags, class/race, focus/click/worn/proc effects, and the zone + mob each one drops from), then hit <b>Load item data</b>. The wiki is live, so you get this week's Crushbone and Splitpaw drops.<br>
       <code>python scrape_eqlwiki.py --zone Crushbone</code> for a quick targeted pull.`
    : `<b>Loaded ${DATA.items.length} items</b> from ${esc(DATA.source||"file")}${DATA.scraped?` · scraped ${esc(DATA.scraped)}`:""}. Re-run the scraper to refresh after a patch.
       <br><br>Tier 0-10 stats are computed here from each item's tier-0 block, not read from the file — the wiki only ever lists tier 0. ${DATA.tiers_included?"This file also carries a baked <code>tiers</code> array; the planner ignores it and recomputes.":""}`;
}

/* ---------------- persistence ----------------
   A refresh used to cost you everything: classes, race, era, filters, weights
   and a fully fitted loadout. None of that is expensive to recompute, but all
   of it is expensive to re-ENTER, which is the part that matters.

   Only the setup is stored. items.json is fetched fresh on every boot (it's
   10MB — well past any localStorage quota, and it's sitting right next to this
   file anyway), so what goes in here is a few kilobytes of choices plus a list
   of item IDs pointing into whatever database happens to load next time.

   That pointer is the whole risk. Re-run the scraper and an item can vanish or
   be renamed, so every restored ID is checked against byId and silently
   dropped if it no longer resolves — which is why restoreState() must run
   AFTER the fetch, not before. Same for every other field: a stored value that
   is no longer a legal option is discarded rather than trusted, because a
   planner that boots into a state its own rules reject is worse than one that
   boots clean. */
const STORE_KEY = "eql-bis:v1";
const PERSIST_SETS  = ["src","zones","locked"];
const PERSIST_PLAIN = ["classes","race","equipped","era","inEra","sort","mobLvl","mobLvlMin",
                       "wMode","weights","planTier","handMode","bardInstr"];

/* Deliberately NOT saved: view (reopening a drawer on refresh is disorienting),
   q / zoneQ / zoneOpen (transient typing), and lastAuto / lastExalt /
   handChoice, which are reports about a run that didn't happen this session. */

let saveTimer = null;
function saveState(){
  /* Never overwrite a good save with a bad one. If items.json failed to load
     we're on the built-in seed, every restored ID has just been dropped as
     unresolvable, and writing that back would turn a temporary network blip
     into permanent data loss. */
  if(DATA.seed) return;
  /* Set by "Forget saved setup". Without it the very next render would write
     the current state straight back and the button would do nothing at all. */
  if(state.saveOff) return;
  try{
    const out = {v:1};
    PERSIST_PLAIN.forEach(k => out[k] = state[k]);
    PERSIST_SETS.forEach(k => out[k] = [...state[k]]);
    localStorage.setItem(STORE_KEY, JSON.stringify(out));
  }catch(e){
    /* Private browsing, a full quota, or a browser that blocks storage on
       file://. Losing the save is annoying; throwing here would take the whole
       render down with it. */
    console.warn("Couldn't save setup:", e.message);
  }
}
const queueSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 400); };

function forgetState(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  state.restored = null;
}

function restoreState(){
  let raw;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){ return; }
  if(!raw) return;
  let j;
  try{ j = JSON.parse(raw); }catch(e){ forgetState(); return; }
  if(!j || j.v !== 1){ forgetState(); return; }

  const dropped = [];
  const legalSlot = new Set(SLOTS.map(s => s.k));
  const legalSort = new Set(SORTS.map(([k]) => k));
  const legalExalt = new Set(EXALTS.map(x => x.k));
  const legalHand = new Set(HAND_MODES.map(m => m[0]));

  if(Array.isArray(j.classes))
    state.classes = [0,1,2].map(n => CLASSES[j.classes[n]] ? j.classes[n] : "");
  if(RACES[j.race])            state.race = j.race;
  if(ERA_IX[j.era] != null)    state.era = j.era;
  if(typeof j.inEra === "boolean") state.inEra = j.inEra;
  if(legalSort.has(j.sort))    state.sort = j.sort;
  if(legalHand.has(j.handMode))state.handMode = j.handMode;
  /* Restored unconditionally — bardInstrOn() gates it on the class at read
     time, so a saved true with no bard restored alongside it is inert, not
     wrong, and comes back the moment a bard is picked again. */
  if(typeof j.bardInstr === "boolean") state.bardInstr = j.bardInstr;
  if(j.wMode === "auto" || j.wMode === "custom") state.wMode = j.wMode;
  if(Number.isFinite(j.planTier))
    state.planTier = Math.max(0, Math.min(10, Math.round(j.planTier)));

  /* Weights are keyed by stat, so a renamed or removed key is skipped rather
     than restored as a stray field the UI never shows but scoreParts reads. */
  if(j.weights && typeof j.weights === "object"){
    const w = {};
    W_KEYS.forEach(k => { if(Number.isFinite(j.weights[k])) w[k] = j.weights[k]; });
    if(Object.keys(w).length) state.weights = w;
  }

  /* A zone that no longer exists in the database would filter every slot down
     to nothing, with no visible cause — the panel would just show empty lists.
     Better to drop it and say so. */
  if(Array.isArray(j.zones)){
    const live = new Set();
    DATA.items.forEach(i => zonesOf(i).forEach(z => live.add(z)));
    j.zones.forEach(z => live.has(z) ? state.zones.add(z) : dropped.push(`zone ${z}`));
  }
  if(Array.isArray(j.src)) j.src.forEach(s => state.src.add(s));
  if(Array.isArray(j.locked))
    j.locked.forEach(k => { if(legalSlot.has(k)) state.locked.add(k); });

  if(j.equipped && typeof j.equipped === "object"){
    for(const [k, e] of Object.entries(j.equipped)){
      if(!legalSlot.has(k) || !e || !byId[e.itemId]){
        if(e && e.itemId) dropped.push(e.itemId);
        continue;
      }
      const exalts = {ornament:null, focus:null, click:null, worn:null, proc:null};
      for(const [t, src] of Object.entries(e.exalts || {}))
        if(legalExalt.has(t) && byId[src]) exalts[t] = src;
      state.equipped[k] = {
        itemId: e.itemId,
        xp: Math.max(0, Math.min(MAX_XP, Math.round(+e.xp || 0))),
        exalts
      };
    }
  }
  /* Locks on slots that ended up empty are meaningless and would quietly stop
     auto-equip from ever filling them. */
  [...state.locked].forEach(k => { if(!state.equipped[k]) state.locked.delete(k); });

  state.restored = {n:Object.keys(state.equipped).length, dropped};
}

/* ---------------- boot ---------------- */
function renderEraNote(){
  const el = document.getElementById("eranow");
  if(!el) return;
  const sel = selectedEraIx(), now = ERA_IX[CURRENT_ERA];
  el.className = "now" + (sel === now ? "" : " off");
  el.textContent = sel === now ? "current EQ Legends content"
    : sel < now ? "rewound — hides gear that is live now"
                : "unreleased — shows gear EQL doesn't have yet";
}

function render(){ renderEraNote(); renderWeights(); renderZones(); renderDoll(); renderTotals(); renderZoneSum(); renderChar(); renderLog(); renderDrawer(); renderDataNote();
  document.getElementById("dollsub").textContent =
    `${Object.keys(state.equipped).length}/${SLOTS.length} slots · ${active().join(" / ")}`;
  /* Every mutation in this app ends in a render(), so hanging the save here
     means no future change can forget to persist itself. Debounced because
     typing in a weight field re-renders on each keystroke and localStorage
     writes are synchronous. */
  queueSave();
}

function initControls(){
  ["c1","c2","c3"].forEach((id, n) => {
    const s = document.getElementById(id);
    s.innerHTML = `<option value="">— none —</option>` +
      Object.entries(CLASSES).map(([k,v]) => `<option value="${k}">${v}</option>`).join("");
    s.value = state.classes[n] || "";
    s.onchange = () => { state.classes[n] = s.value; render(); };
  });
  const r = document.getElementById("race");
  r.innerHTML = Object.entries(RACES).map(([k,v]) => `<option value="${k}">${v}</option>`).join("");
  r.value = state.race;
  r.onchange = () => { state.race = r.value; render(); };

  const era = document.getElementById("era");
  era.innerHTML = ERA_ORDER.map(e =>
    `<option value="${e}">${e.replace(/ Era$/, "")}${e === CURRENT_ERA ? " — live" : ""}</option>`).join("");
  era.value = state.era;
  era.onchange = () => { state.era = era.value; render(); };
  renderEraNote();

  const cf = document.getElementById("charfile");
  document.getElementById("loadchar").onclick = () => cf.click();
  cf.onchange = () => {
    const file = cf.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const j = JSON.parse(rd.result);
        if(!j.races || !j.classes) throw new Error("expecting races{} and classes{}");
        const total = j.class_add_total || 30;
        const bad = Object.entries(j.classes).filter(([,v]) =>
          Object.values(v).reduce((a,b)=>a+b,0) !== total).map(([k])=>k);
        if(bad.length && !confirm(
          `These classes don't add up to ${total}: ${bad.join(", ")}.\n\n` +
          `Every EQL class is worth exactly ${total} points, so that's probably a typo. Load anyway?`)) return;
        CHAR = j; render();
      }catch(e){ alert("Couldn't read that file: " + e.message + "\n\nExpecting chardata.json."); }
    };
    rd.readAsText(file);
  };

  const f = document.getElementById("file");
  document.getElementById("load").onclick = () => f.click();
  f.onchange = () => {
    const file = f.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const j = JSON.parse(rd.result);
        const items = Array.isArray(j) ? j : j.items;
        if(!Array.isArray(items)) throw new Error("no items array");
        DATA = {source:j.source||file.name, scraped:j.scraped, items, seed:false};
        reindex(); state.equipped = {}; state.view = {mode:"slot",slot:null,exalt:null};
        render();
      }catch(e){
        alert("Couldn't read that file: " + e.message +
          "\n\nExpecting items.json from scrape_eqlwiki.py.");
      }
    };
    rd.readAsText(file);
  };
}

/* ---------------- boot ----------------
   On a hosted deploy (GitHub Pages and friends) items.json and chardata.json
   sit next to this file, so fetch them rather than making the user click
   "Load item data" every visit.

   initControls() and render() are called at the END, once, after both fetches
   have settled. Calling them up front is the race: render() reads DATA and
   derivedWeights() reads CHAR.stat_weights, so an early first paint shows the
   seed data and a weight vector built from the default character table, and
   nothing re-runs when the real files land.

   Note both fetches are in their own try/catch, and the boot calls are in
   `finally`. A missing or malformed file must not cost you a working planner —
   it falls back to the built-in seed and says so. That also covers opening
   this file over file://, where fetch throws outright. */
async function autoLoadHostedData(){
  try{
    try{
      const res = await fetch("./items.json");
      if(res.ok){
        const j = await res.json();
        const items = Array.isArray(j) ? j : j.items;
        if(!Array.isArray(items)) throw new Error("no items array");
        DATA = {source:j.source || "hosted items.json", scraped:j.scraped,
                items, seed:false};
        reindex();
      } else {
        console.warn("items.json not loaded — HTTP", res.status);
      }
    }catch(e){
      console.warn("items.json unavailable, using built-in seed:", e.message);
    }

    try{
      /* Optional side file — see itemMobLevel(). 404 is the normal case. */
      const res = await fetch("./moblevels.json");
      if(res.ok){
        const j = await res.json();
        if(j && typeof j === "object" && !Array.isArray(j)){
          MOBLEVELS = {};
          for(const [k,v] of Object.entries(j))
            if(typeof v === "number") MOBLEVELS[k.toLowerCase()] = v;
          _mobLevelCount = Object.keys(MOBLEVELS).length;
          /* Items are already indexed by now (items.json is fetched first), so
             the memo can be filled immediately rather than on first use. The
             zone spans have to go first: they were computed with an empty
             level table, and the quest fallback reads them. */
          _zoneLv = null;
                  buildMobLevelIndex();
        }
      }
    }catch(e){ /* absent by design on most deploys */ }

    try{
      /* Optional too, and independent: quest levels are useful even if the
         mob table is missing, and vice versa. */
      const res = await fetch("./questlevels.json");
      if(res.ok){
        const j = await res.json();
        const lv = (j && j.levels) || j;
        if(lv && typeof lv === "object" && !Array.isArray(lv)){
          QUESTLEVELS = {};
          for(const [k,v] of Object.entries(lv))
            if(typeof v === "number") QUESTLEVELS[k.toLowerCase()] = v;
          QUESTWHY = (j && j.why) || {};
          /* The mob memo caches quest-derived levels too, so it has to be
             rebuilt now that the quest table exists. */
          buildMobLevelIndex();
        }
      }
    }catch(e){ /* absent by design on most deploys */ }

    try{
      const res = await fetch("./chardata.json");
      if(res.ok){
        const j = await res.json();
        /* Same sanity check the manual loader uses — a chardata file missing
           races{} or classes{} would break attribute totals silently. */
        if(j.races && j.classes) CHAR = j;
        else console.warn("chardata.json has no races/classes — keeping defaults");
      }
    }catch(e){
      console.warn("chardata.json unavailable, using defaults:", e.message);
    }
  } finally {
    /* Order matters twice over. restoreState() reads byId, so it has to follow
       the fetch or every equipped ID would be dropped as unresolvable. And
       initControls() seeds the class/race/era dropdowns from state, so it has
       to follow the restore or the selects would show defaults while the
       planner scored a different trio underneath. */
    restoreState();
    initControls();
    render();
  }
}

autoLoadHostedData();
</script>
</body>
</html>

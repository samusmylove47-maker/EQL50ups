<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="=Upgrades — a gear planner for EverQuest Legends trios. Rank every slot by what it actually gains, with the source tier of every number on screen. No account; sets travel in the link."
    />
    <!--
      Titled the way the site titles its pages: "<page> — EQL Source", as in
      "Tools — EQL Source" and "Sky Ledger — EQL Source". This tool is one page
      of that site, published on its /tools/ index, not a site of its own.

      The page name is `=Upgrades`, which is what the rest of the project calls
      this tool: 701 files across the site against 8 — its own title, og:title
      and description — that said "50 Upgrades". The owner's own account of the
      sigil is that `=` stands for E-Q-L-S, read "equals", so `=Upgrades` and
      "EQLS Upgrades" are one name and this page was the only surface using a
      third. `chrome.test.tsx` pins the title against `TOOL_NAME` so the two
      cannot drift apart again.

      The published URL stays `/tools/50-upgrades` — it is the site's to change,
      not this repository's, and links already exist against it.
    -->
    <title>=Upgrades — EQL Source</title>
    <meta property="og:title" content="=Upgrades — EQL Source" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EQL Source" />
    <!--
      `%BASE_URL%`, not `./`, on this link and on the font stylesheet below.

      Vite substitutes it with the build's `base` — `/` at the root,
      `/EQL50ups/` on Pages, `/tools/50-upgrades/` when eqlsource.com serves it
      — so the URL never depends on how the document itself was addressed. `./`
      does: it resolves against the document's DIRECTORY, and
      `/tools/50-upgrades` and `/tools/50-upgrades/` have different directories.

      This is not hypothetical. The site's own measurement of that path records
      `200` with no redirect to the trailing-slash form, and a subdirectory
      build served that way was measured here:

        VITE_BASE=/tools/50-upgrades/ npm run build, served at both shapes

        no trailing slash   @font-face rules parsed 0   404: /tools/fonts/fonts.css
                            all four families FELL BACK (identical advance widths)
        trailing slash      @font-face rules parsed 7   404s 0
                            all four families USED

      Falling back to the local stack is the one failure state that looks like a
      design choice rather than a bug — `public/fonts/fonts.css` says so about
      its own `src` paths, which were fixed for the same reason one level down.
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!--
      The four type roles read off eqlsource.com's own stylesheet: Cinzel for
      the wordmark and the top two heading levels, Saira Condensed for display
      below those, IBM Plex Mono for nav, eyebrows, labels and numerals, Public
      Sans for running text. (An earlier version of this comment named Playfair
      Display, Oswald, Lato and JetBrains Mono — the four faces a previous pass
      guessed at from a screenshot, none of which the site uses. The miss is
      recorded in research/DESIGN-EQLSOURCE.md because it is instructive.)

      Self-hosted, deliberately — and this is the one place this app must NOT
      follow the site, which links the same four faces from fonts.googleapis.com.
      They were briefly loaded that way here too, with a comment claiming
      `display=swap` kept the page paintable if that host never answered. It
      does not: `swap` governs the font-face swap, not the stylesheet, and a
      <link rel="stylesheet"> blocks rendering until it resolves or the socket
      gives up. Measured on a network where the host is unreachable, first paint
      went from 68ms to 12,884ms — a blank page for thirteen seconds.

      An app whose own landing copy promises "no account, no server: your sets
      live in this browser" should not hand a third party the power to stop it
      booting. 152KB of woff2, latin subset, served from our own origin.
    -->
    <link rel="stylesheet" href="%BASE_URL%fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

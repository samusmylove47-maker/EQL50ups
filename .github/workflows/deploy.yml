name: Deploy EQL Upgrades to GitHub Pages

on:
  push:
    branches: [claude/eql-gear-optimizer-tfzvh6, main]
  workflow_dispatch:

# Allow one deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # The suite is the deploy gate. A red build must not reach the URL a
      # player is planning their raid gear against.
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: web
        run: npx vitest run

      - name: Build
        working-directory: web
        # Pages serves a project site from /<repo>/, so the bundle has to be
        # built against that base or every asset and data fetch 404s.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # A hash route means the server never sees the path, but a cold link to
      # /<repo>/ still has to resolve, and a 404 page keeps a stale bookmark
      # from looking like the site is gone.
      - name: SPA fallback
        working-directory: web
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
